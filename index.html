        .floating-hearts span {
            position: relative;
        }

        .floating-hearts span:before,
        .floating-hearts span:after {
            position: absolute;
            content: "";
            left: 18px;
            top: 0;
            width: 18px;
            height: 30px;
            background: #d17b7c;
            border-radius: 30px 30px 0 0;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }

        .floating-hearts span:after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }

        @keyframes moveclouds {
            0% {
                top: 500px;
            }

            100% {
                top: -500px;
            }
        }

        @keyframes sideWays {
            0% {
                margin-left: 0px;
            }

            100% {
                margin-left: 50px;
            }
        }

        @keyframes swayWays {
            0% {
                transform: rotate(12deg);
                left: -0.3%;
            }

            33% {
                transform: rotate(-2deg);
                left: 0.7%;
            }

            100% {
                transform: rotate(0deg);
                left: -12%;
            }
        }

    <script>
        (function () {
            const heartLayer = document.querySelector(".floating-hearts");
            const musicToggle = document.getElementById("musicToggle");
            const musicLabel = document.getElementById("musicLabel");
            const musicFile = document.getElementById("musicFile");
            const musicStatus = document.getElementById("musicStatus");
            const backgroundMusic = document.getElementById("backgroundMusic");
            const defaultTrack = "assets/audio/Parineeta_Music.mp3";
            const legacyTrack = "Parineeta_Music";

            let objectUrl = null;
            let isPlaying = false;

            function updateStatus(message) {
                musicStatus.textContent = message;
            }

            function loadTrack(src, label) {
                if (objectUrl) {
                    URL.revokeObjectURL(objectUrl);
                    objectUrl = null;
                }

                backgroundMusic.src = src;
                backgroundMusic.currentTime = 0;
                isPlaying = false;
                musicToggle.classList.remove("is-playing");
                musicToggle.classList.add("has-track");
                musicToggle.setAttribute("aria-pressed", "false");
                musicToggle.setAttribute("aria-label", " Play music");
                musicLabel.textContent = " Play Music";
                updateStatus(label);
            }

            backgroundMusic.addEventListener("error", () => {
                if (
                    backgroundMusic.src &&
                    backgroundMusic.src.endsWith(defaultTrack)
                ) {
                    updateStatus(
                        `No default track found. Add ${defaultTrack} or choose a file.`,
                    );
                    loadTrack(legacyTrack, `Trying legacy track: ${legacyTrack}`);
                } else if (
                    backgroundMusic.src &&
                    backgroundMusic.src.endsWith(legacyTrack)
                ) {
                    updateStatus(
                        `No default track found. Add ${defaultTrack} or choose a file.`,
                    );
                    backgroundMusic.removeAttribute("src");
                    backgroundMusic.load();
                } else {
                    updateStatus("Unable to load the selected audio file.");
                }
                isPlaying = false;
                musicToggle.classList.remove("is-playing");
                musicToggle.setAttribute("aria-pressed", "false");
                musicLabel.textContent = "Play Music";
            });

            function setPlaying(nextState) {
                if (!backgroundMusic.src) {
                    updateStatus("Choose an audio file first");
                    musicFile.click();
                    return;
                }

                isPlaying = nextState;
                musicToggle.classList.toggle("is-playing", isPlaying);
                musicToggle.classList.toggle(
                    "has-track",
                    Boolean(backgroundMusic.src),
                );
                musicToggle.setAttribute("aria-pressed", String(isPlaying));
                musicToggle.setAttribute(
                    "aria-label",
                    isPlaying ? "Pause music" : "Play music",
                );
                musicLabel.textContent = isPlaying ? "Pause Music" : "Play Music";

                if (isPlaying) {
                    backgroundMusic.play().catch(() => {
                        isPlaying = false;
                        musicToggle.classList.remove("is-playing");
                        musicToggle.setAttribute("aria-pressed", "false");
                        musicLabel.textContent = "Play Music";
                        updateStatus("Tap play again after choosing a file");
                    });
                    updateStatus("Playing audio");
                } else {
                    backgroundMusic.pause();
                    updateStatus("Paused");
                }
            }

            musicFile.addEventListener("change", () => {
                const file = musicFile.files && musicFile.files[0];
                if (!file) return;

                objectUrl = URL.createObjectURL(file);
                loadTrack(objectUrl, `Loaded: ${file.name}`);
            });

            musicToggle.addEventListener("click", () => {
                setPlaying(!isPlaying);
            });

            loadTrack(defaultTrack, `Default track set: ${defaultTrack}`);

            window.addEventListener("beforeunload", () => {
                if (objectUrl) {
                    URL.revokeObjectURL(objectUrl);
                }
            });
        })();
    </script>
