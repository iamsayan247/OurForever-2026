        .floating-hearts span {
            position: relative;
        }

        .floating-hearts span:before,
        .floating-hearts span:after {
            position: absolute;
            content: "";
            left: 18px;
            top: 0;
            width: 18px;
            height: 30px;
            /* background: #d17b7c; */
            border-radius: 30px 30px 0 0;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }

        .floating-hearts span:nth-child(6n+1):before,
        .floating-hearts span:nth-child(6n+1):after {
            background: #ff4d6d;
        }

        .floating-hearts span:nth-child(6n+2):before,
        .floating-hearts span:nth-child(6n+2):after {
            background: #ff758f;
        }

        .floating-hearts span:nth-child(6n+3):before,
        .floating-hearts span:nth-child(6n+3):after {
            background: #ff8fa3;
        }

        .floating-hearts span:nth-child(6n+4):before,
        .floating-hearts span:nth-child(6n+4):after {
            background: #ffb3c1;
        }

        .floating-hearts span:nth-child(6n+5):before,
        .floating-hearts span:nth-child(6n+5):after {
            background: #fb6f92;
        }

        .floating-hearts span:nth-child(6n):before,
        .floating-hearts span:nth-child(6n):after {
            background: #ff477e;
        }


        .floating-hearts span:after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }


        @keyframes moveclouds {
            0% {
                top: 500px;
            }

            100% {
                top: -500px;
            }
        }

        @keyframes sideWays {
            0% {
                margin-left: 0px;
            }

            100% {
                margin-left: 50px;
            }
        }

        @keyframes swayWays {
            0% {
                transform: rotate(12deg);
                left: -0.3%;
            }

            33% {
                transform: rotate(-2deg);
                left: 0.7%;
            }

            100% {
                transform: rotate(0deg);
                left: -12%;
            }
        }




        .map-button {
            position: static;
            background: #fff5f0;
            padding: clamp(10px, 1.6vw, 16px) clamp(18px, 4vw, 34px);
            border-radius: 999px;
            border: 2px solid #a94444;
            text-decoration: none;
            color: #7a1f1f;
            font-size: clamp(13px, 2vw, 20px);
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
            max-width: 100%;
            width: fit-content;
            transition: transform 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
            z-index: 5;
            pointer-events: auto;
        }

        .map-button:hover {
            transform: scale(1.04);
            background: #fff;
            box-shadow: 0 10px 25px rgba(122, 31, 31, 0.18);
        }

        .music-note {
            position: absolute;
            right: 18px;
            bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--wine);
            background: rgba(255, 248, 240, 0.84);
            border: 1px solid rgba(122, 31, 31, 0.18);
            border-radius: 999px;
            padding: 10px 14px;
            font-size: clamp(12px, 1.4vw, 16px);
            box-shadow: 0 8px 20px rgba(122, 31, 31, 0.12);
            backdrop-filter: blur(4px);
            z-index: 4;
            animation: musicPulse 4s ease-in-out infinite;
            cursor: pointer;
            border: none;
        }

        .music-note i {
            color: var(--rose);
            font-size: 1.1em;
        }

        .music-note input {
            display: none;
        }

        .music-note.is-playing {
            background: rgba(255, 235, 225, 0.95);
            box-shadow: 0 10px 24px rgba(122, 31, 31, 0.18);
        }

        .music-note.has-track {
            border: 2px dashed rgba(168, 68, 68, 0.65);
        }

        .music-status {
            display: none;
            position: absolute;
            right: 18px;
            bottom: 68px;
            max-width: min(320px, calc(100% - 36px));
            color: #fff4ec;
            background: rgba(122, 31, 31, 0.72);
            border: 1px solid rgba(255, 235, 225, 0.18);
            border-radius: 999px;
            padding: 8px 12px;
            font-size: 12px;
            box-shadow: 0 8px 20px rgba(122, 31, 31, 0.16);
            z-index: 4;
            pointer-events: none;
        }

        @keyframes musicPulse {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-3px);
            }
        }

        @media (max-width: 980px) {

            .music-note {

            }

            .music-status {

        }

        @media (max-width: 380px) {
